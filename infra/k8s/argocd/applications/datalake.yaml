# 데이터 레이크 PVC — sync-wave 1 (airflow(wave 2)가 마운트하기 전에 PVC 존재).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datalake
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/f-lab-edu/Market-Layer-Platform.git
    targetRevision: develop
    path: infra/k8s/apps/datalake
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    # 최초 생성 및 Airflow 마운트 확인 후 automated를 활성화한다.
    syncOptions:
      - CreateNamespace=true
