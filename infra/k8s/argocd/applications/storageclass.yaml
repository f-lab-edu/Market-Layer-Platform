# local-path-provisioner + default StorageClass (sync-wave 0 — 모든 PVC 선결조건)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storageclass
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/f-lab-edu/Market-Layer-Platform.git
    targetRevision: develop
    path: infra/k8s/bootstrap/storageclass
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    # 라이브 StorageClass의 Delete -> Retain 변경을 확인한 뒤 수동 sync한다.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
