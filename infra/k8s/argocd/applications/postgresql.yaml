# PostgreSQL (pgvector) — kustomize 디렉토리. sync-wave 1 (storageclass 이후).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # 레포의 매니페스트 참조
  source:
    repoURL: https://github.com/f-lab-edu/Market-Layer-Platform.git
    targetRevision: develop
    path: infra/k8s/apps/platform/postgresql
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    # 기존 StatefulSet/PVC 인수 전에는 수동 sync한다.
    syncOptions:
      - CreateNamespace=true
