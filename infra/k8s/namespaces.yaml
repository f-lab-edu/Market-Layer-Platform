# 생명주기 기준 네임스페이스 정의 (단일 출처)
# platform = 항상 떠있는 공용 인프라 / pipeline = 배치 작업 / serving = 전달 계층
# 부트스트랩 Phase 0에서 `kubectl apply -f`로 1회 수동 적용(이 파일을 가리키는 Application은 없음).
# 각 app은 CreateNamespace=true도 가지나, 그건 라벨 없는 ns만 만들므로 이 정의를 먼저 적용한다.
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    app.kubernetes.io/part-of: fin-signal
    lifecycle: always-on
---
apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
  labels:
    app.kubernetes.io/part-of: fin-signal
    lifecycle: batch
---
apiVersion: v1
kind: Namespace
metadata:
  name: serving
  labels:
    app.kubernetes.io/part-of: fin-signal
    lifecycle: delivery
