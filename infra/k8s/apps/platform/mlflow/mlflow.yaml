# MLflow Tracking Server — platform 네임스페이스 (라이브 구성을 기반으로 운영 안전성 보완)
# backend store = PostgreSQL의 mlflow DB, artifact store = 로컬 PVC.
# Service FQDN: mlflow.platform.svc.cluster.local:5000
# Secret(mlflow-secret, key=MLFLOW_BACKEND_STORE_URI)은 Git 밖 — 사전 주입.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts-pvc
  namespace: platform
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi          # 라이브 일치
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: platform
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  strategy:
    type: Recreate          # RWO PVC 단일 마운트 안전(라이브는 RollingUpdate였음 — 권장 개선)
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      automountServiceAccountToken: false
      # nodeSelector 없음 — artifact PVC(local-path)가 Pod를 볼륨 노드에 자동 핀
      containers:
        - name: mlflow
          # -full 이미지에 PostgreSQL 드라이버가 포함되므로 런타임 패키지 설치를 하지 않는다.
          image: ghcr.io/mlflow/mlflow:v3.10.0-full
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec mlflow server \
                --host 0.0.0.0 \
                --port 5000 \
                --backend-store-uri "$MLFLOW_BACKEND_STORE_URI" \
                --serve-artifacts \
                --artifacts-destination /mlflow/artifacts \
                --allowed-hosts "localhost:*,127.0.0.1:*,mlflow.platform.svc.cluster.local:*" \
                --cors-allowed-origins "http://localhost:5000,http://127.0.0.1:5000"
          ports:
            - containerPort: 5000
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: MLFLOW_BACKEND_STORE_URI       # postgresql://admin:<pw>@postgresql.platform.svc.cluster.local:5432/mlflow
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: MLFLOW_BACKEND_STORE_URI
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,mlflow.platform.svc.cluster.local"
            - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
              value: "http://localhost:5000,http://127.0.0.1:5000"
          volumeMounts:
            - name: mlflow-artifacts
              mountPath: /mlflow/artifacts
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi
              ephemeral-storage: 2Gi
      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: platform
  labels:
    app: mlflow
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
