name: Build Airflow Image

on:
  push:
    branches: [develop]
    paths:
      - Dockerfile.airflow
      - pyproject.toml
      - requirements-airflow.txt
      - src/**
      - .github/workflows/airflow-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/f-lab-edu/market-layer-platform-airflow
  AIRFLOW_VERSION: "3.2.2"
  PYTHON_VERSION: "3.12"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Login to GHCR
        # docker/login-action@v3.7.0
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          echo "sha_tag=develop-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        # docker/build-push-action@v6.19.2
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.airflow
          push: true
          build-args: |
            AIRFLOW_VERSION=${{ env.AIRFLOW_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:develop
