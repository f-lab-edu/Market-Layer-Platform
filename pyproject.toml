[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-layer-platform"
version = "0.1.0"
description = "Market Layer Platform data ingestion, feature, ML, and serving code."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fredapi>=0.5.2,<1",
  "pandas>=2.2,<3",
  "praw>=7.8,<8",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=24,<25",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "requests>=2.32,<3",
  "yfinance>=0.2.50,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["market_layer*"]
